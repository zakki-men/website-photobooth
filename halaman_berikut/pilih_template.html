<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pilih Template Anda</h1>
      <div class="template-options">
        <div class="template-card" data-template="vertical">
          <div class="template-preview vertical">
            <div class="preview-item"></div>
            <div class="preview-item"></div>
            <div class="preview-item"></div>
          </div>
          <h2>3 Gambar (Vertikal)</h2>
          <button class="select-button">Pilih</button>
        </div>
        <div class="template-card" data-template="horizontal-top-bottom">
          <div class="template-preview horizontal-top-bottom">
            <div class="preview-item top"></div>
            <div class="preview-bottom">
              <div class="preview-item bottom"></div>
              <div class="preview-item bottom"></div>
            </div>
          </div>
          <h2>3 Gambar (Horizontal Atas, Dua Bawah)</h2>
          <button class="select-button">Pilih</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
