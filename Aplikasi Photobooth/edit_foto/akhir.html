<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atur Desain</title>
    <link rel="stylesheet" href="style_atur_desain.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Atur Desain</h1>
      <div class="preview-area">
        <div id="template-container"></div>
      </div>
      <div class="controls">
        <div class="shape-controls">
          <h2>Bentuk Foto</h2>
          <div class="shape-options">
            <button id="shape-square" class="shape-button active">
              Persegi
            </button>
            <button id="shape-circle" class="shape-button">Lingkaran</button>
          </div>
        </div>
        <div class="frame-controls">
          <h2>Warna Bingkai</h2>
          <div class="color-palette">
            <div
              class="color-option active"
              style="background-color: #8c2f39"
              data-color="#8C2F39"
            ></div>
            <div
              class="color-option"
              style="background-color: #f4b183"
              data-color="#F4B183"
            ></div>
            <div
              class="color-option"
              style="background-color: #f7dc6f"
              data-color="#F7DC6F"
            ></div>
            <div
              class="color-option"
              style="background-color: #d0e6a5"
              data-color="#D0E6A5"
            ></div>
            <div
              class="color-option"
              style="background-color: #a0d2eb"
              data-color="#A0D2EB"
            ></div>
            <div
              class="color-option"
              style="background-color: #d1a3b0"
              data-color="#D1A3B0"
            ></div>
            <div
              class="color-option"
              style="background-color: #7b6f6f"
              data-color="#7B6F6F"
            ></div>
            <div
              class="color-option"
              style="background-color: white"
              data-color="white"
            ></div>
            <div
              class="color-option"
              style="background-color: black"
              data-color="black"
            ></div>
          </div>
        </div>
        <div class="background-controls">
          <h2>Tekstur Latar Belakang</h2>
          <div class="texture-options">
            <div
              class="texture-option active"
              style="background-image: url('texture1.png')"
              data-texture="texture1.png"
            ></div>
            <div
              class="texture-option"
              style="background-image: url('texture2.png')"
              data-texture="texture2.png"
            ></div>
            <div
              class="texture-option"
              style="background-image: url('texture3.png')"
              data-texture="texture3.png"
            ></div>
            <div
              class="texture-option"
              style="background-color: #e0e0e0"
              data-texture="solid_lightgray"
            ></div>
            <div
              class="texture-option"
              style="background-color: #c0c0c0"
              data-texture="solid_gray"
            ></div>
            <div
              class="texture-option"
              style="background-color: #a9a9a9"
              data-texture="solid_darkgray"
            ></div>
          </div>
        </div>
        <button id="download-button">Unduh</button>
      </div>
    </div>
    <script src="script_atur_desain.js"></script>
  </body>
</html>
