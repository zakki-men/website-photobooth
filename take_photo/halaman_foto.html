<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth - Ambil Foto</title>
    <link rel="stylesheet" href="style_foto.css" />
  </head>
  <body>
    <div class="container">
      <div class="camera-section">
        <div class="camera-preview">
          <video id="video" autoplay></video>
        </div>
        <div class="camera-controls">
          <button class="take-photo-button">Ambil Foto</button>
          <label for="upload-photo" class="upload-button">
            Pilih dari Album
          </label>
          <input
            type="file"
            id="upload-photo"
            accept="image/*"
            multiple
            style="display: none"
          />
          <span class="photo-count">Foto: 0/3</span>
        </div>
      </div>

      <div class="filter-section">
        <h2>Pilih Filter</h2>
        <div class="filters">
          <button class="filter-button active" data-filter="normal">
            Normal
          </button>
          <button class="filter-button" data-filter="sepia">Sepia</button>
          <button class="filter-button" data-filter="black-and-white">
            Black &amp; White
          </button>
          <button class="filter-button" data-filter="invert">
            Invert Colors
          </button>
          <button class="filter-button" id="custom-filter-button">
            Custom
          </button>
        </div>
      </div>

      <div class="results-section">
        <h2>Hasil Foto</h2>
        <div class="photo-results-container" id="photoResultsContainer"></div>
      </div>

      <div class="background-selection">
        <h2>Pilih Latar Belakang</h2>
        <div class="background-buttons">
          <button
            class="background-button"
            data-background="black"
            style="
              background-image: linear-gradient(to bottom, #333, #000);
              color: white;
              border: none;
            "
          >
            Normal
          </button>
          <button
            class="background-button"
            data-background="white"
            style="
              background-image: linear-gradient(to bottom, #f0f0f0, #fff);
              color: black;
              border: 1px solid #ccc;
            "
          >
            Putih
          </button>
          <button
            class="background-button"
            data-background="red"
            style="
              background-image: linear-gradient(to bottom, #f00, #800);
              color: white;
              border: none;
            "
          >
            Merah
          </button>
          <button
            class="background-button"
            data-background="blue"
            style="
              background-image: linear-gradient(to bottom, #00f, #008);
              color: white;
              border: none;
            "
          >
            Biru
          </button>
          <label
            for="upload-background"
            id="custom-background-button"
            class="background-button"
            style="
              background-image: linear-gradient(to bottom, #ddd, #eee);
              color: black;
              border: 1px solid #ccc;
            "
            >Custom</label
          >
          <input
            type="file"
            id="upload-background"
            accept="image/*"
            style="display: none"
          />
        </div>
      </div>

      <div class="navigation-wrapper">
        <button class="reset-button">Ulang</button>
        <button class="next-button">Next</button>
      </div>

      <div id="custom-filter-box" class="custom-filter-box">
        <div class="custom-filter-header">
          <span class="custom-filter-title">Pengaturan Custom</span>
          <span class="close-button">&times;</span>
        </div>
        <div class="custom-filter-controls">
          <div class="control-item">
            <label for="zoom">Zoom</label>
            <div class="slider-container">
              <button class="slider-minus">-</button>
              <input
                type="range"
                id="zoom"
                min="1"
                max="2"
                value="1"
                step="0.05"
              />
              <button class="slider-plus">+</button>
            </div>
          </div>
          <div class="control-item">
            <label for="brightness">Brightness</label>
            <div class="slider-container">
              <button class="slider-minus">-</button>
              <input
                type="range"
                id="brightness"
                min="0"
                max="2"
                value="1"
                step="0.05"
              />
              <button class="slider-plus">+</button>
            </div>
          </div>
          <div class="control-item">
            <label for="contrast">Contrast</label>
            <div class="slider-container">
              <button class="slider-minus">-</button>
              <input
                type="range"
                id="contrast"
                min="0"
                max="2"
                value="1"
                step="0.05"
              />
              <button class="slider-plus">+</button>
            </div>
          </div>
          <div class="control-item">
            <label for="sharpness">Sharpness</label>
            <div class="slider-container">
              <button class="slider-minus">-</button>
              <input
                type="range"
                id="sharpness"
                min="0"
                max="2"
                value="1"
                step="0.05"
              />
              <button class="slider-plus">+</button>
            </div>
          </div>
          <div class="control-item">
            <label for="saturation">Saturation</label>
            <div class="slider-container">
              <button class="slider-minus">-</button>
              <input
                type="range"
                id="saturation"
                min="0"
                max="2"
                value="1"
                step="0.05"
              />
              <button class="slider-plus">+</button>
            </div>
          </div>
        </div>
        <div class="custom-filter-footer">
          <button id="reset-custom-filter">Reset Settings</button>
        </div>
      </div>
      <div id="countdown-circle"></div>
    </div>
    <script src="script_foto.js"></script>
  </body>
</html>
