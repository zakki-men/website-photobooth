<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1 class="title">photobooth</h1>
        <p class="tagline">
          capture the moment, cherish the magic, relive the love
        </p>
        <p class="creator">xieaa</p>
        <div class="buttons">
          <button id="start-button" class="start-button">
            <svg viewBox="0 0 24 24" fill="currentColor" class="icon">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17v-4h2v4h-2zm0-12v8h2V7h-2z"
              />
            </svg>
            Start Booth
          </button>
          <button class="like-button">
            <svg viewBox="0 0 24 24" fill="currentColor" class="icon">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          </button>
        </div>
        <p class="made-by">made by zaezkyi <span class="heart">♥</span></p>
        <p class="copyright">© 2025 xieaa. All Rights Reserved.</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
